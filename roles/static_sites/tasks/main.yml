---
# Build + atomic publish for website and/or docs.

- name: Required domains + deploy key
  assert:
    that:
      - (app_domain | default('') | length) > 0
      - (website_domain | default('') | length) > 0
      - (docs_domain | default('') | length) > 0
      - (vault_app_git_deploy_key | default(unset_marker) | string) != unset_marker
      - site in ['website', 'docs', 'all']
    fail_msg: >-
      Set app_domain / website_domain / docs_domain, vault_app_git_deploy_key
      (pubkey must also be a deploy key on cleantask-website and cleantask-docs),
      and site=website|docs|all.
    quiet: true

- name: Resolve which sites to publish
  set_fact:
    sites_selected: >-
      {{
        ['website', 'docs'] if site == 'all'
        else [site]
      }}
    sites_website_ref: "{{ website_version | default(version | default(sites_website_version)) }}"
    sites_docs_ref: "{{ docs_version | default(version | default(sites_docs_version)) }}"
    sites_app_url: "https://{{ app_domain }}"
    sites_docs_url: "https://{{ docs_domain }}"
    sites_repo_ssh_website: "{{ sites_website_repo | regex_replace('^git@github\\.com:', 'git@' ~ app_git_ssh_host_alias ~ ':') }}"
    sites_repo_ssh_docs: "{{ sites_docs_repo | regex_replace('^git@github\\.com:', 'git@' ~ app_git_ssh_host_alias ~ ':') }}"

- name: Parent directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ sites_src_root }}"
    - "{{ sites_www_root }}"
    - "{{ app_deploy_key_dir | dirname }}"

- name: Deploy-key directory
  file:
    path: "{{ app_deploy_key_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Deploy key (read-only clone)
  copy:
    content: "{{ vault_app_git_deploy_key }}\n"
    dest: "{{ app_deploy_key_dir }}/id_ed25519"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true

- name: SSH config for GitHub deploy key
  template:
    src: ssh_config.j2
    dest: "{{ app_deploy_key_dir }}/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Pull Node image {{ sites_node_image }}
  become: true
  become_user: "{{ ansible_user }}"
  command: docker pull {{ sites_node_image }}
  register: sites_node_pull
  changed_when: "'Downloaded newer image' in sites_node_pull.stdout or 'Pull complete' in sites_node_pull.stdout"

- name: Publish website
  include_tasks: website.yml
  when: "'website' in sites_selected"

- name: Publish docs
  include_tasks: docs.yml
  when: "'docs' in sites_selected"
