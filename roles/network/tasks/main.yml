---
- name: nftables package
  apt:
    name: nftables
    state: present

- name: Host firewall (table inet cleantask only — never flush ruleset)
  template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  notify: reload nftables

- name: nftables enabled
  systemd:
    name: nftables
    state: started
    enabled: true

- meta: flush_handlers
