---
# Official Docker Engine on Ubuntu (pinned packages from download.docker.com).

- name: Dependencies for the Docker apt repository
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Docker apt keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false

# Ubuntu 26.04 (resolute) may not have a Docker repo yet; fall back to the
# latest LTS codename Docker publishes (noble = 24.04).
- name: Docker apt suite for this Ubuntu release
  set_fact:
    docker_apt_suite: "{{ ansible_distribution_release if ansible_distribution_release in ['jammy', 'noble'] else 'noble' }}"

- name: Docker apt repository
  apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64')
      | replace('aarch64', 'arm64') }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ docker_apt_suite }} stable
    filename: docker
    state: present
    update_cache: true

- name: Docker Engine and Compose plugin
  apt:
    name: "{{ docker_packages }}"
    state: present

- name: Docker daemon JSON (log rotation)
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    mode: "0644"
  notify: restart docker

- name: Docker running
  systemd:
    name: docker
    state: started
    enabled: true

- name: Deploy user in the docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- meta: flush_handlers
