---
# Application deploy (Docker Compose). Overridable with -e version=…

app_root: /opt/cleantask
app_repo: git@github.com:cleantask/cleantask.git
app_version: main
app_compose_file: docker-compose.prod.yml
app_compose_override: docker-compose.override.yml
app_image_name: cleantask
app_keep_images: 3
app_media_host_path: /var/lib/cleantask/media
# Deploy key lives OUTSIDE app_root so `git clone` sees an empty directory.
app_deploy_key_dir: /var/lib/cleantask/deploy
# Fixed bridge subnet so pg_hba + nftables stay predictable.
app_docker_subnet: 172.28.0.0/16
# Health before nginx / tunnel exist: hit the published loopback port.
app_health_url: http://127.0.0.1:8000/core/health/
app_health_host_header: localhost
app_deploy_marker: .deployed
app_git_ssh_host_alias: github.com-cleantask

# .env non-secret defaults (avoid "<…>" inside Jinja default() — it breaks templating)
app_default_from_email: "CleanTask <security@cleantask.co>"
app_reply_to_email: "support@cleantask.co"
app_admin_upgrade_email: "admin@cleantask.co"
app_book_a_call_url: "mailto:admin@cleantask.co"
app_django_log_level: INFO
app_sentry_traces_sample_rate: "0.1"
app_gmail_inbox_scopes_enabled: "False"
app_turnstile_enabled: "True"
app_company_lookup_provider: cbeapi
app_company_lookup_timeout: 8
app_cbeapi_base_url: "https://cbeapi.be/api"
app_cbeapi_lang: fr
app_assistant_llm_provider: mock
app_document_ai_provider: mock
app_assistant_llm_timeout: 60
app_assistant_max_tool_loops: 4
app_assistant_max_rows_per_tool: 50
app_assistant_user_hourly_quota: 30
app_assistant_openrouter_base_url: "https://openrouter.ai/api/v1"
app_assistant_openrouter_zdr: "true"
app_assistant_azure_api_version: "2024-10-21"
app_assistant_bedrock_region: "eu-central-1"
# Gunicorn Uvicorn workers (override per inventory). Prod CPX42: 8 or 9.
app_gunicorn_workers: 3
