---
# Standalone PostgreSQL from PGDG. Patroni replaces the process manager later;
# data directory and roles stay.

- name: postgresql-common (PGDG helper)
  apt:
    name: postgresql-common
    state: present
    update_cache: true

- name: PGDG apt repository
  command: /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
  args:
    creates: /etc/apt/sources.list.d/pgdg.list

- name: PostgreSQL {{ pg_version }}
  apt:
    name:
      - "postgresql-{{ pg_version }}"
      - "postgresql-contrib-{{ pg_version }}"
      - python3-psycopg2
    state: present
    update_cache: true

- name: PostgreSQL conf.d directory
  file:
    path: "/etc/postgresql/{{ pg_version }}/main/conf.d"
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"

- name: CleanTask PostgreSQL settings
  template:
    src: conf.d/cleantask.conf.j2
    dest: "/etc/postgresql/{{ pg_version }}/main/conf.d/cleantask.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: restart postgresql

- name: pg_hba.conf
  template:
    src: pg_hba.conf.j2
    dest: "/etc/postgresql/{{ pg_version }}/main/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: reload postgresql

- name: Include conf.d from postgresql.conf
  lineinfile:
    path: "/etc/postgresql/{{ pg_version }}/main/postgresql.conf"
    regexp: '^include_dir\s*='
    line: "include_dir = 'conf.d'"
  notify: restart postgresql

- name: PostgreSQL running
  systemd:
    name: "postgresql@{{ pg_version }}-main"
    state: started
    enabled: true

- meta: flush_handlers

- name: Application role {{ pg_user }}
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ pg_user }}"
    password: "{{ vault_pg_password }}"
    role_attr_flags: LOGIN
  no_log: true

- name: Application database {{ pg_database }}
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ pg_database }}"
    owner: "{{ pg_user }}"
    encoding: UTF8
    template: template0

# Owner already has full rights from postgresql_db; this keeps the grant
# explicit and idempotent for community.postgresql >= 5 (roles/objs API).
- name: Privileges on {{ pg_database }}
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    login_db: "{{ pg_database }}"
    type: database
    objs: "{{ pg_database }}"
    roles: "{{ pg_user }}"
    privs: ALL
