---
# Staging-only settings. Shared defaults live in group_vars/all/ (next to
# the playbooks). A key must never appear in both places.

env_name: staging

# Public hostnames (Cloudflare Tunnel). One label under cleantask.co —
# Universal SSL only covers *.cleantask.co.
app_domain: app-staging.cleantask.co
website_domain: staging.cleantask.co
docs_domain: docs-staging.cleantask.co

# Home LAN: no Hetzner Cloud Network / vSwitch. Firewall still installed;
# SSH stays open on the LAN until admin_ips is filled.
private_network_enabled: false
admin_ips: []

# Docker Compose project directory on the server.
app_root: /opt/cleantask
# Track the app development branch; prod will use main.
app_version: dev
app_media_host_path: /var/lib/cleantask/media
# Staging Redis cache: keep memory low on the 1.6 GiB VM.
app_redis_cache_maxmemory: 64mb
# ~1.6 GiB VM: keep web workers low (prod CPX42 uses 8–9 — see PERF_TEST_CPX42).
app_gunicorn_workers: 2

# Non-secret app settings mirrored from the local .env (secrets stay in vault).
app_default_from_email: "CleanTask <security@cleantask.co>"
app_reply_to_email: "support@cleantask.co"
app_admin_upgrade_email: "admin@cleantask.co"
app_book_a_call_url: "mailto:admin@cleantask.co"
app_gmail_inbox_scopes_enabled: "False"
app_turnstile_enabled: "True"
app_turnstile_site_key: "1x00000000000000000000AA"
app_stripe_publishable_key: "pk_test_51TrD8o03KoxBOXkDAkdlUftjWy7RNE1CBwRd4ilzCZu87zZ4M0YiItLNESLojSSTEQ2ikd61Vd0Lb0zJADuklsT9006moY1cQF"
app_stripe_price_starter: "price_1TrgQD03KoxBOXkD3D52ec9b"
app_stripe_price_professional: "price_1TrgR203KoxBOXkDnp8HOycs"
app_stripe_price_business: "price_1TrgR303KoxBOXkD8FD6KKwm"
app_company_lookup_provider: cbeapi
app_company_lookup_timeout: 8
app_cbeapi_base_url: "https://cbeapi.be/api"
app_cbeapi_lang: fr
# openrouter on the server (not ASSISTANT_LOCAL_* / localhost).
app_assistant_llm_provider: openrouter
app_document_ai_provider: openrouter
app_assistant_llm_timeout: 60
app_assistant_max_tool_loops: 4
app_assistant_max_rows_per_tool: 50
app_assistant_user_hourly_quota: 30
app_assistant_openrouter_model: "openai/gpt-4.1-mini"
app_assistant_openrouter_base_url: "https://openrouter.ai/api/v1"
app_assistant_openrouter_zdr: "true"

# PostgreSQL — light settings for the 1.6 GiB staging VM.
# Production overrides these from RAM facts / host_vars.
pg_shared_buffers_mb: 128
pg_effective_cache_size_mb: 512
pg_work_mem_mb: 4
pg_maintenance_work_mem_mb: 64
pg_max_connections: 100
