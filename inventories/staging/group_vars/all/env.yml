---
# Staging-only settings. Shared defaults live in group_vars/all/ (next to
# the playbooks). A key must never appear in both places.

env_name: staging

# Public hostnames (Cloudflare Tunnel). One label under cleantask.co —
# Universal SSL only covers *.cleantask.co.
app_domain: app-staging.cleantask.co
website_domain: staging.cleantask.co
docs_domain: docs-staging.cleantask.co

# Home LAN: no Hetzner Cloud Network / vSwitch. Firewall still installed;
# SSH stays open on the LAN until admin_ips is filled.
private_network_enabled: false
admin_ips: []

# Docker Compose project directory on the server.
app_root: /opt/cleantask
# Track the app development branch; prod will use main.
app_version: dev
app_media_host_path: /var/lib/cleantask/media
# Staging Redis cache: keep memory low on the 1.6 GiB VM.
app_redis_cache_maxmemory: 64mb

# PostgreSQL — light settings for the 1.6 GiB staging VM.
# Production overrides these from RAM facts / host_vars.
pg_shared_buffers_mb: 128
pg_effective_cache_size_mb: 512
pg_work_mem_mb: 4
pg_maintenance_work_mem_mb: 64
pg_max_connections: 100
