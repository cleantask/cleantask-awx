---
# Staging: single Proxmox VM at home (app + db on the same host).
# Groups are split by role so the later HA layout (2× app+db + etcd) is
# only an inventory change.
all:
  children:
    app_servers:
      hosts:
        ct-staging-app-01:
          ansible_host: 192.168.10.115
    db_servers:
      hosts:
        ct-staging-app-01:
    # Empty until HA: three etcd members (two app servers + arbiter).
    dcs_servers:
      hosts: {}
  vars:
    ansible_user: ubuntu
