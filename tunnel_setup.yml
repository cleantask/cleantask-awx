---
# Nginx (loopback) + Cloudflare Tunnel in front of the app.
# Run after server_setup (+ deploy for the app vhost to answer).
# Does not clone the app or static sites (see deploy.yml / deploy_sites.yml).

- hosts: app_servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  force_handlers: true

  pre_tasks:
    - name: Load per-environment vault
      import_role:
        name: load_vault

  roles:
    - nginx
    - cloudflared
