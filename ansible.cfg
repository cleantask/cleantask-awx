[defaults]
# Staging by default on the command line; prod: -i inventories/prod/hosts.yml
inventory = inventories/staging/hosts.yml
roles_path = roles
collections_path = ./collections
interpreter_python = auto_silent
# Default callback — the yaml callback needs community.general.
# Fail fast when a host is unreachable rather than hanging on retries.
timeout = 30

[ssh_connection]
# One SSH round-trip per task (Ubuntu sudoers has no requiretty by default).
pipelining = True
