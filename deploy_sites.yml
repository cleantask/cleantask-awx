---
# Build and publish the marketing site and/or docs (static files for Nginx).
# Independent of deploy.yml (the Django app).
#
# Extra vars:
#   site=website|docs|all     (default: all)
#   version=<ref>             (applied to both when set)
#   website_version=<ref>     (override website only)
#   docs_version=<ref>        (override docs only)

- hosts: app_servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  force_handlers: true

  pre_tasks:
    - name: Load per-environment vault
      import_role:
        name: load_vault

  roles:
    - static_sites
